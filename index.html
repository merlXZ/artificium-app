<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/main.js" defer></script>
</head>

<body>

<!--============ SECTION ============-->
<section class="login">
	<div class="login__left">
		<a href="#" class="login__logo"><img src="assets/img/logo.svg" alt="logo"></a>
		<div class="login__form form">
			<h1 class="form__title">Let's get <span> creative!</span></h1>
			<p class="form__subtitle">Log in to Artificium to start creating magic.</p>
			<div class="form__input email">
				<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="24.000000" height="24.000000" fill="none" customFrame="#000000">
					<rect id="Lead Icon" width="24.000000" height="24.000000" x="0.000000" y="0.000000" />
					<path id="icon" d="M19 5C20.1046 5 21 5.89543 21 7L21 16C21 16.8284 20.6642 17.5784 20.1213 18.1213C19.5784 18.6642 18.8284 19 18 19L6 19C5.17157 19 4.42157 18.6642 3.87868 18.1213C3.33579 17.5784 3 16.8284 3 16L3 7C3 5.89543 3.89543 5 5 5L19 5ZM4 6L10 12L10.5858 12.5858C11.3668 13.3668 12.6332 13.3668 13.4142 12.5858L14 12L20 6M20.1213 18.1213L14 12M3.87868 18.1213L10 12" fill-rule="nonzero" stroke="rgb(104,107,110)" stroke-linecap="round" stroke-width="1.500000" />
				</svg>
				<input type="email" placeholder="Email" class="input-email" required>
				<span class="form__input-error">Incorrect email!</span>
			</div>
			<div class="form__input password">
				<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="24.000000" height="24.000000" fill="none" customFrame="#000000">
					<rect id="Lead Icon" width="24.000000" height="24.000000" x="0.000000" y="0.000000" />
					<path id="icon" d="M17 10C18.1046 10 19 10.8954 19 12L19 18C19 19.1046 18.1046 20 17 20L7 20C5.89543 20 5 19.1046 5 18L5 12C5 10.8954 5.89543 10 7 10L17 10ZM8 10L8 8C8 5.79086 9.79086 4 12 4C14.2091 4 16 5.79086 16 8L16 10M12 15C11.4477 15 11 14.5523 11 14C11 13.4477 11.4477 13 12 13C12.5523 13 13 13.4477 13 14C13 14.5523 12.5523 15 12 15ZM12 15L12 17" fill-rule="evenodd" stroke="rgb(104,107,110)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.500000" />
				</svg>
				<input type="password" placeholder="Password" class="input-password" required>
				<button type="button" class="form__password-toggle">Show</button>
				<span class="form__password-error">The password should not be short and should contain at least one digit.</span>
			</div>
			<div class="form__help">
				<label class="form__checkbox">
					<input type="checkbox" class="form__checkbox-input">
					<span class="form__checkbox-box"></span>
					<span class="form__checkbox-text">Remember me</span>
				</label>
				<a href="#" class="form__forgot">Forgot Password?</a>
			</div>
			<div class="form__button">
				<button class="button button-form">Log in</button>
			</div>
		</div>
		<div class="line">
			<span></span>
			<p class="line-text">or continue with</p>
			<span></span>
		</div>
		<div class="login__socials">
			<button class="login__socials-btn">
				<img src="assets/login/icon/google-icon.svg" alt="google-icon">
				Google Account
			</button>
			<button class="login__socials-btn">
				<img src="assets/login/icon/apple-icon.svg" alt="apple-icon">
				Apple Account
			</button>
		</div>
		<div class="login__signup">
			<span class="login__signup-text">Don’t have an account?</span>
			<a href="register.html" class="login__signup-link">Sign Up</a>
		</div>
	</div>
		<img class="login__right" src="assets/login/img/Illustration.png" alt="Illustration">
</section>


</body>

</html>
